# crates/search-core 를 Vercel 함수 환경(x86_64 Linux, Python 3.12)용 wheel 로 빌드한다.
# Vercel 빌드 이미지에는 Rust 툴체인이 없어서 wheel 은 여기서 만들어 GitHub Release 에 올린다.
# 버전은 Cargo.toml 한 곳에서 정한다. 같은 버전의 Release 가 이미 있으면 덮어쓰지 않고 건너뛴다.
# 서비스는 Release 주소를 고정해서 가리키므로, 올라간 wheel 은 바뀌면 안 된다.
name: core-wheel

on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - '.github/workflows/core-wheel.yml'
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/core-wheel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/search-core
          target: x86_64
          manylinux: auto
          args: --release --out dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import check
        run: |
          python -m pip install crates/search-core/dist/*.whl
          python -c "import o2un_search_core as m; print(m.__name__, [n for n in ('chunk', 'tokenize') if hasattr(m, n)])"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: crates/search-core/dist/*.whl

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/search-core/Cargo.toml | head -1)
          tag="core-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 이 이미 있어 건너뛴다. 새로 올리려면 Cargo.toml 의 version 을 올린다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" dist/*.whl --target "$GITHUB_SHA" \
            --title "search-core $version" --notes "crates/search-core wheel (cp312-abi3, manylinux x86_64)."
          echo "$tag 을 올렸다: $(ls dist)" >> "$GITHUB_STEP_SUMMARY"
