[package]
name = "o2un_search_core"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.20.2"
hex = "0.4.3"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312"] }
sha2 = "0.11.1"
unicode-normalization = "0.1.26"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
serde_json = "1.0.154"

[lints.clippy]
# 부정은 `!x` 대신 `false == x` 로 쓴다.
bool_comparison = "allow"
