[project]
name = "o2un-indexer"
version = "0.1.0"
description = "Chunking, tokenizing and indexing for o2un devlog search"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
indexer = "indexer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
