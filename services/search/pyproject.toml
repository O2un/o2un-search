[project]
name = "o2un-search-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "o2un-indexer",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.30"]

[tool.uv.sources]
# 일반(non-editable) 설치. editable 이면 함수 번들 밖의 ../../indexer 를 가리킨다.
o2un-indexer = { path = "../../indexer", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
